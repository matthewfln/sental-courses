# --- ????????? ???? ?????? PostgreSQL ---
spring.datasource.url=jdbc:postgresql://postgres:5432/bankdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- ????????? JPA / Hibernate ---
# ????????????? ????????? ????? ?? ??? ???????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- ????????? Apache Kafka ---
# ??????? ?? 3 ????????
spring.kafka.bootstrap-servers=kafka1:19092,kafka2:29092,kafka3:39092

# --- ????????? ????????? ---
spring.kafka.consumer.group-id=bank-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

# ?????????????? JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.senlabank.model

# ?????? ????????? ???????
spring.kafka.listener.type=batch
spring.kafka.consumer.max-poll-records=50

# ?????? ?????? ?????????????? ??????????
spring.kafka.consumer.isolation-level=read_committed

# --- ????????? ????????? ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ????????????? ???????? ?? ???? in-sync ??????
spring.kafka.producer.acks=all

# ??????? ?????????? ??? ???????? Exactly once
spring.kafka.producer.transaction-id-prefix=bank-tx-